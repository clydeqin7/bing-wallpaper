name: Download Bing Wallpaper

on:
  schedule:
    - cron: "0 17 * * *" # 北京时间凌晨1点触发（UTC+8）
  workflow_dispatch: # 手动触发

permissions:
  contents: write

# 同一时间只跑一个实例，避免手动触发与定时任务互相覆盖提交
concurrency:
  group: download-bing-wallpaper
  cancel-in-progress: false

jobs:
  update-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段锁定，避免 pnpm 大版本漂移
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: |
          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Run Bing Wallpaper Script (tsx)
        run: |
          echo "Running Bing Wallpaper script with tsx..."
          pnpm exec tsx src/index.ts

      - name: Format public folder with Prettier
        run: |
          echo "Formatting public folder with Prettier..."
          pnpm exec prettier --write "public/**/*.md" "public/**/*.json" "README.md"

      - name: Commit and push Markdown/JSON file
        env:
          GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
          GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Committing and pushing Markdown/JSON file..."
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git config --local user.name "${GIT_USER_NAME:-github-actions[bot]}"
          git config --local user.email "${GIT_USER_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git add README.md public/wallpapers/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # 设置时区为北京时间（UTC+8）
          export TZ=Asia/Shanghai
          git commit -m "Update Bing wallpaper Markdown for $(date +'%Y-%m-%d')"

          # 远端有新提交时（例如另一个实例刚推送）先 rebase 再重试一次
          git push || {
            echo "Push rejected, rebasing and retrying..."
            git pull --rebase --autostash origin main
            git push
          }
